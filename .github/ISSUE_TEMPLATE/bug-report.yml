name: 🐛 Bug Report
description: Report a problem with the repository
title: "[BUG] "
labels:
  - bug

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the issue
      description: Clearly explain what went wrong.
      placeholder: Tell us what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Explain how we can reproduce the issue.
      placeholder: |
        1. Go to...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add screenshots, links, or other useful information.
